# Tiny Tapeout project information
project:
  title:        "CMOS5L 8x4 Project" # Project title (placeholder)
  author:       "Ilia Greenblat"   # Your name (placeholder)
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Jane Street challenge 8x4-tile design on IHP SG13CMOS5L" # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Clock frequency in Hz (50 MHz, matches CLOCK_PERIOD=20 in src/config.json)

  # How many tiles your design occupies?
  # IHP SG13CMOS5L: 8x4 = 1724.16 x 710.64 um die (tt-support-tools tech/ihp-sg13cmos5l/tile_sizes.yaml)
  tiles: "8x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_greenblat_protocoler"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "io_cluster.v"
    - "iopin.v"
    - "synchronizer_level.v"
    - "syncfifo.v"
    - "syncfifo_v2.v"
    - "fplp_cluster.v"
    - "ig_debuguart.v"
    - "dbgparser.v"
    - "tx_sender.v"
    - "ig_uart.v"
    - "synchronizer_rst_n.v"
    - "ram_subsystem.v"
    - "ram_module.v"
    - "fplp_rgf.v"
    - "cpu_cluster.v"
    - "doorbells.v"
    - "fplp_cpu_v2.v"
    - "fplp_stack.v"
    - "fplpx_decoder.v"
    - "variables.v"
    - "posedge_detect.v"


# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "rxd_i"
  ui[1]: "switches[0]"
  ui[2]: "switches[1]"
  ui[3]: "switches[2]"
  ui[4]: "pin_in[8]"
  ui[5]: "pin_in[9]"
  ui[6]: "pin_in[10]"
  ui[7]: "pin_in[11]"

  # Outputs
  uo[0]: "txd_o"
  uo[1]: "led[0]"
  uo[2]: "led[1]"
  uo[3]: "led[2]"
  uo[4]: "led[3]"
  uo[5]: "pin_out[9]"
  uo[6]: "pin_out[10]"
  uo[7]: "pin_out[11]"

  # Bidirectional pins
  uio[0]: "pin_in[0] pin_out[0]"
  uio[1]: "pin_in[1] pin_out[1]"
  uio[2]: "pin_in[2] pin_out[2]"
  uio[3]: "pin_in[3] pin_out[3]"
  uio[4]: "pin_in[4] pin_out[4]"
  uio[5]: "pin_in[5] pin_out[5]"
  uio[6]: "pin_in[6] pin_out[6]"
  uio[7]: "pin_in[7] pin_out[7]"

# Do not change!
yaml_version: 6
